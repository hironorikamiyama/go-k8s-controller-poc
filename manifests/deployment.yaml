apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: go-k8s-poc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80