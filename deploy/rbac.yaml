
apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-k8s-controller
  namespace: go-k8s-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: go-k8s-controller
  namespace: go-k8s-poc
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: go-k8s-controller
  namespace: go-k8s-poc
subjects:
  - kind: ServiceAccount
    name: go-k8s-controller
    namespace: go-k8s-poc
roleRef:
  kind: Role
  name: go-k8s-controller
  apiGroup: rbac.authorization.k8s.io
